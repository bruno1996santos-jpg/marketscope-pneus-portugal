name: Validar catálogo MarketScope
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar catálogo de campanhas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('monitorizacao/relatorio_diario.json').read_text(encoding='utf-8'))
          campaigns = d.get('campanhas')
          assert isinstance(campaigns, list), 'campanhas[] em falta'
          ids = [x.get('candidate_id') for x in campaigns]
          assert all(ids), 'candidate_id em falta'
          assert len(ids) == len(set(ids)), 'candidate_id duplicados'
          print('Catálogo válido:', len(ids), 'campanhas')
          PY
