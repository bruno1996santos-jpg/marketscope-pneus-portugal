<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketScope | Revisão</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px system-ui;background:#f3f5f8;color:#182230;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}header,.card{background:white;border:1px solid #dce2ea;border-radius:12px;padding:18px;margin:14px 0}header{background:#101d32;color:white}.toolbar,.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:7px}button{background:#1455a0;color:white;cursor:pointer}.approve{background:#147d52}.reject{background:#9f3440}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field input,.field textarea{width:100%;box-sizing:border-box}.wide{grid-column:1/-1}.note{background:#eaf1fb;padding:12px;border-radius:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><header><h1>MarketScope</h1>Revisão de campanhas — Portugal | Pneus ligeiros</header><p class="note">Acesso reservado ao utilizador autorizado. Confirme sempre as candidatas na fonte original. Novos registos são importados como pendentes; apenas uma ação explícita os aprova.</p><section class="card"><h2>Sessão</h2><div class="toolbar"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Palavra-passe"><button id="login">Entrar</button><button id="logout" hidden>Terminar sessão</button></div></section><div id="controls" class="toolbar" hidden><input id="q" placeholder="Pesquisar…"><select id="status"><option>Todos</option><option>Pendente de validação</option><option>Aprovada</option><option>Rejeitada</option></select><button id="reload">Sincronizar</button><button id="backup">Exportar backup JSON</button><button id="csv">Exportar aprovadas CSV</button><label>Importar backup <input id="file" type="file" accept="application/json"></label></div><p id="msg" role="status"></p><p id="summary"></p><section id="list"></section></main><script>
const db=window.supabase.createClient('https://lgjrnuelvwsvmbusufvu.supabase.co','sb_publishable_VAeZZvYfq134xQVSJ0APxQ_f1x75mXG'),OWNER='bruno1996santos@gmail.com';let rows=[];const $=x=>document.getElementById(x),say=t=>$('msg').textContent=t;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||'').slice(0,10))?String(v).slice(0,10):null;
function fromDb(r){return {...r,candidate_id:r.candidate_id||String(r.id),titulo:r.campaign_name||'',marca_sugerida:r.brand||'',retalhista_sugerido:r.retailer||'',mecanicas_sugeridas:r.mechanics||'',valores_detetados:r.detected_values||'',data_inicio:r.start_date||'',data_fim:r.end_date||'',ambito:r.scope||'',publico_alvo:r.audience||'',resumo_interpretacao:r.interpretation_summary||'',observacoes_revisor:r.reviewer_notes||'',url:r.source_url||'',publicador:r.publisher||r.source_name||'',detetada_em_utc:r.detected_at||'',estado_validacao:r.verification_status==='verified'?'Aprovada':r.verification_status==='rejected'?'Rejeitada':'Pendente de validação'}}
function payload(r){return {candidate_id:r.candidate_id,brand:r.marca_sugerida||r.brand||'Não especificada',retailer:r.retalhista_sugerido||r.retailer||null,campaign_name:r.titulo||r.campaign_name||null,campaign_type:r.campaign_type||null,audience:r.publico_alvo||r.audience||null,product_category:'Pneus ligeiros',start_date:date(r.data_inicio||r.start_date),end_date:date(r.data_fim||r.end_date),mechanics:r.mecanicas_sugeridas||r.mechanics||null,offer:r.offer||null,source_url:r.url||r.source_url||null,source_name:r.publicador||r.source_name||null,source_date:date(r.source_date),verification_status:r.estado_validacao==='Aprovada'?'verified':r.estado_validacao==='Rejeitada'?'rejected':'pending',notes:r.notas||r.notes||null,detected_at:r.detetada_em_utc||r.detected_at||null,scope:r.ambito||r.scope||null,detected_values:r.valores_detetados||r.detected_values||null,interpretation_summary:r.resumo_interpretacao||r.interpretation_summary||null,publisher:r.publicador||r.publisher||null,reviewer_notes:r.observacoes_revisor||r.reviewer_notes||null}}
async function owner(){const {data:{user}}=await db.auth.getUser();if(user?.email?.toLowerCase()!==OWNER){await db.auth.signOut();return false}return true}async function state(){const {data:{session}}=await db.auth.getSession();const ok=!!session&&await owner();$('controls').hidden=!ok;$('logout').hidden=!ok;$('login').hidden=ok;$('email').disabled=ok;$('password').disabled=ok;if(ok)await load();else{rows=[];$('list').innerHTML='';say('Inicie sessão com a conta autorizada.')}}$('login').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){say('Erro de autenticação: '+error.message);return}await state()};$('logout').onclick=async()=>{await db.auth.signOut();await state()};
async function load(){try{if(!await owner())throw Error('Conta não autorizada.');const {data,error}=await db.from('campaigns').select('*').order('created_at',{ascending:false});if(error)throw error;const all=new Map((data||[]).map(r=>[r.candidate_id||String(r.id),fromDb(r)]));const response=await fetch('monitorizacao/candidatas_estruturadas.json?ts='+Date.now());if(response.ok){const c=await response.json();for(const x of c.campanhas||[]){if(!x.candidate_id||all.has(x.candidate_id))continue;all.set(x.candidate_id,fromDb({candidate_id:x.candidate_id,campaign_name:x.titulo,brand:x.marca_sugerida,retailer:x.retalhista_sugerido,mechanics:Array.isArray(x.mecanicas_sugeridas)?x.mecanicas_sugeridas.join('; '):x.mecanicas_sugeridas,audience:x.publico_alvo,start_date:x.data_inicio,end_date:x.data_fim,source_url:x.url,source_name:x.publicador,publisher:x.publicador,detected_at:x.detetada_em_utc,scope:x.ambito,detected_values:x.valores_detetados,interpretation_summary:[x.resumo_interpretacao,Array.isArray(x.datas_detetadas)&&x.datas_detetadas.length?'Datas detetadas: '+x.datas_detetadas.join(' | '):''].filter(Boolean).join('\n'),verification_status:'pending',notes:x.notas}))}}rows=[...all.values()];const novas=rows.filter(r=>!r.id);if(novas.length){say('A importar '+novas.length+' candidatas novas para validação…');for(const r of novas){const p=payload(r);const {data,error}=await db.from('campaigns').upsert(p,{onConflict:'candidate_id'}).select().single();if(error)throw error;if(data)Object.assign(r,fromDb(data));}}draw();say(novas.length?novas.length+' candidatas novas importadas como pendentes para validação.':'Dados sincronizados. Sem novas candidatas por importar.')}catch(e){say('Falha ao carregar: '+e.message)}}
async function save(r){if(!await owner()){say('Sessão inválida.');return false}const p=payload(r);const {data,error}=await db.from('campaigns').upsert(p,{onConflict:'candidate_id'}).select('candidate_id,verification_status').single();if(error){say('Erro ao guardar: '+error.message);return false}if(!data){say('O Supabase não confirmou a gravação.');return false}say(r.estado_validacao==='Aprovada'?'Campanha aprovada e publicada no Dashboard.':'Alterações guardadas no Supabase.');return true}const fields=[['marca_sugerida','Marca'],['retalhista_sugerido','Retalhista'],['mecanicas_sugeridas','Mecânica(s)'],['valores_detetados','Valores detetados'],['data_inicio','Data início (AAAA-MM-DD)'],['data_fim','Data fim (AAAA-MM-DD)'],['ambito','Âmbito'],['publico_alvo','Público-alvo'],['resumo_interpretacao','Resumo revisto'],['observacoes_revisor','Notas do revisor']];function draw(){const q=$('q').value.toLowerCase(),s=$('status').value,shown=rows.filter(r=>(s==='Todos'||r.estado_validacao===s)&&JSON.stringify(r).toLowerCase().includes(q));$('summary').textContent=`${shown.length} visíveis · ${rows.filter(r=>r.estado_validacao==='Aprovada').length} aprovadas · ${rows.filter(r=>r.estado_validacao==='Pendente de validação').length} pendentes · ${rows.filter(r=>r.estado_validacao==='Rejeitada').length} rejeitadas`;$('list').innerHTML=shown.map(r=>{let i=rows.indexOf(r);return `<article class="card" data-i="${i}"><b>${esc(r.estado_validacao)}</b><h2>${esc(r.titulo||'Candidata sem título')}</h2><p>${esc(r.candidate_id)} · ${esc(r.publicador)} · ${esc(r.detetada_em_utc)}</p><p><a target="_blank" rel="noopener" href="${esc(r.url||'#')}">Abrir fonte original ↗</a></p><div class="note"><b>Evidência automática</b><br><strong>Mecânica:</strong> ${esc(r.mecanicas_sugeridas||'Por determinar')}<br><strong>Valores:</strong> ${esc(r.valores_detetados||'Não detetados')}<br><strong>Âmbito:</strong> ${esc(r.ambito||'Por confirmar')}<br><strong>Extração:</strong> ${esc(r.notas||'Sem evidência adicional.')}<br><small>Confirma estes dados na fonte original antes de aprovar.</small></div><div class="grid">${fields.map(([k,l])=>`<label class="field ${['resumo_interpretacao','observacoes_revisor'].includes(k)?'wide':''}">${l}${['resumo_interpretacao','observacoes_revisor'].includes(k)?`<textarea data-k="${k}" rows="3">${esc(r[k])}</textarea>`:`<input data-k="${k}" value="${esc(r[k])}">`}</label>`).join('')}</div><div class="actions"><button data-save="${i}">Guardar</button><button class="approve" data-state="Aprovada" data-index="${i}">Aprovar e guardar</button><button class="reject" data-state="Rejeitada" data-index="${i}">Rejeitar e guardar</button><button data-state="Pendente de validação" data-index="${i}">Pendente</button></div></article>`}).join('')||'<div class="card">Sem registos.</div>';document.querySelectorAll('[data-i]').forEach(c=>c.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>rows[+c.dataset.i][e.dataset.k]=e.value));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(rows[+b.dataset.save]));document.querySelectorAll('[data-state]').forEach(b=>b.onclick=async()=>{let r=rows[+b.dataset.index],prev=r.estado_validacao;r.estado_validacao=b.dataset.state;const ok=await save(r);if(!ok)r.estado_validacao=prev;draw()})}
function download(n,t,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([t],{type}));a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}$('q').oninput=draw;$('status').onchange=draw;$('reload').onclick=load;$('backup').onclick=()=>download('marketscope-backup.json',JSON.stringify({exportado_em:new Date().toISOString(),campanhas:rows},null,2),'application/json');$('csv').onclick=()=>{let a=rows.filter(r=>r.estado_validacao==='Aprovada'),keys=['candidate_id','titulo','marca_sugerida','retalhista_sugerido','mecanicas_sugeridas','valores_detetados','data_inicio','data_fim','ambito','publico_alvo','resumo_interpretacao','url','observacoes_revisor'];let c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('marketscope-aprovadas.csv',[keys.join(','),...a.map(r=>keys.map(k=>c(r[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')};$('file').onchange=async e=>{try{let p=JSON.parse(await e.target.files[0].text());if(!Array.isArray(p.campanhas))throw Error('JSON inválido');for(let r of p.campanhas){r.estado_validacao='Pendente de validação';await save(r)}await load();say('Importação concluída; itens importados mantidos pendentes.')}catch(x){say('Falha na importação: '+x.message)}e.target.value=''};db.auth.onAuthStateChange(()=>setTimeout(state,0));state();
</script></body></html>
