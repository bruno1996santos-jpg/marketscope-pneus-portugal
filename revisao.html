const db=window.supabase.createClient('https://lgjrnuelvwsvmbusufvu.supabase.co','sb_publishable_VAeZZvYfq134xQVSJ0APxQ_f1x75mXG'),OWNER='bruno1996santos@gmail.com';let rows=[],showLegacy=false;const $=x=>document.getElementById(x),say=t=>$('msg').textContent=t;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||'').slice(0,10))?String(v).slice(0,10):null;

async function owner(){const {data:{user}}=await db.auth.getUser();if(user?.email?.toLowerCase()!==OWNER){await db.auth.signOut();return false}return true}async function state(){const {data:{session}}=await db.auth.getSession();const ok=!!session&&await owner();$('controls').hidden=!ok;$('logout').hidden=!ok;$('login').hidden=ok;$('email').disabled=ok;$('password').disabled=ok;if(ok)await load();else{rows=[];$('list').innerHTML='';say('Inicie sessão com a conta autorizada.')}}$('login').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){say('Erro de autenticação: '+error.message);return}await state()};$('logout').onclick=async()=>{await db.auth.signOut();await state()};
async function load(){try{
 if(!await owner())throw Error('Conta não autorizada.');

   Object.assign(existing,{

    valor_maximo:x.valor_maximo??existing.valor_maximo,

  }else{
   all.set(x.candidate_id,fromDb({
    candidate_id:x.candidate_id,campaign_name:x.titulo,brand:x.marca_sugerida,
    retailer:x.retalhista_sugerido,mechanics,offer:x.oferta_sugerida,
    tyre_quantity:x.numero_pneus,rim_size:x.jante_dimensao,models_covered:x.modelos_abrangidos,
    min_value:x.valor_minimo,max_value:x.valor_maximo,
    audience:x.publico_alvo,start_date:x.data_inicio,end_date:x.data_fim,
    source_url:x.url,source_name:x.publicador,publisher:x.publicador,

   }));

 }
 rows=[...all.values()];

  say('A sincronizar dados do relatório diário…');

   const {data:saved,error:saveError}=await db.from('campaigns').upsert(payload(r),{onConflict:'candidate_id'}).select().single();
   if(saveError)throw saveError;
   if(saved)Object.assign(r,fromDb(saved));
  }
 }
 draw();
 say('Relatório diário: '+feed.updated_at+' · '+novas.length+' novas e '+atualizar.length+' pendentes atualizadas. Campanhas antigas preservadas, mas ocultas por defeito.');
}catch(e){say('Falha ao carregar: '+e.message)}
}
async function save(r){if(!await owner()){say('Sessão inválida.');return false}const p=payload(r);const {data,error}=await db.from('campaigns').upsert(p,{onConflict:'candidate_id'}).select('candidate_id,verification_status').single();if(error){say('Erro ao guardar: '+error.message);return false}if(!data){say('O Supabase não confirmou a gravação.');return false}say(r.estado_validacao==='Aprovada'?'Campanha aprovada e publicada no Dashboard.':'Alterações guardadas no Supabase.');return true}const fields=[['marca_sugerida','Marca'],['retalhista_sugerido','Retalhista'],['mecanicas_sugeridas','Mecânica(s)'],['oferta_sugerida','Oferta / benefício'],['valor_minimo','Valor mínimo (€)'],['valor_maximo','Valor máximo (€)'],['numero_pneus','N.º pneus'],['jante_dimensao','Jante / dimensão'],['modelos_abrangidos','Modelos / gama abrangida'],['valores_detetados','Valores detetados'],['data_inicio','Data início (AAAA-MM-DD)'],['data_fim','Data fim (AAAA-MM-DD)'],['ambito','Âmbito'],['publico_alvo','Público-alvo'],['resumo_interpretacao','Resumo revisto'],['observacoes_revisor','Notas do revisor']];function draw(){const q=$('q').value.toLowerCase(),s=$('status').value,shown=rows.filter(r=>(showLegacy||!r._sourceMissing)&&(s==='Todos'||r.estado_validacao===s)&&JSON.stringify(r).toLowerCase().includes(q));$('summary').textContent=`${shown.length} visíveis · ${rows.filter(r=>r.estado_validacao==='Aprovada').length} aprovadas · ${rows.filter(r=>r.estado_validacao==='Pendente de validação'&&(showLegacy||!r._sourceMissing)).length} pendentes · ${rows.filter(r=>r.estado_validacao==='Rejeitada').length} rejeitadas`;$('list').innerHTML=shown.map(r=>{let i=rows.indexOf(r);return `<article class="card" data-i="${i}"><b>${esc(r.estado_validacao)}</b>${r._sourceMissing?'<p class="note"><strong>Atenção:</strong> Esta candidata já não consta da monitorização mais recente. Não aprovar sem voltar a confirmar a existência e os detalhes da campanha na fonte original.</p>':''}<h2>${esc(r.titulo||'Candidata sem título')}</h2><p>${esc(r.candidate_id)} · ${esc(r.publicador)} · ${esc(r.detetada_em_utc)}</p><p><a target="_blank" rel="noopener" href="${esc(r.url||'#')}">Abrir fonte original ↗</a></p><div class="note"><b>Evidência automática</b><br><strong>Mecânica:</strong> ${esc(r.mecanicas_sugeridas||'Por determinar')}<br><strong>Valores:</strong> ${esc(r.valores_detetados||'Não detetados')}<br><strong>Âmbito:</strong> ${esc(r.ambito||'Por confirmar')}<br><strong>Extração:</strong> ${esc(r.notas||'Sem evidência adicional.')}<br><small>Confirma estes dados na fonte original antes de aprovar.</small></div><div class="grid">${fields.map(([k,l])=>`<label class="field ${['resumo_interpretacao','observacoes_revisor'].includes(k)?'wide':''}">${l}${['resumo_interpretacao','observacoes_revisor'].includes(k)?`<textarea data-k="${k}" rows="3">${esc(r[k])}</textarea>`:`<input data-k="${k}" value="${esc(r[k])}">`}</label>`).join('')}</div><div class="actions"><button data-save="${i}">Guardar</button><button class="approve" data-state="Aprovada" data-index="${i}">Aprovar e guardar</button><button class="reject" data-state="Rejeitada" data-index="${i}">Rejeitar e guardar</button><button data-state="Pendente de validação" data-index="${i}">Pendente</button></div></article>`}).join('')||'<div class="card">Sem registos.</div>';document.querySelectorAll('[data-i]').forEach(c=>c.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>rows[+c.dataset.i][e.dataset.k]=e.value));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(rows[+b.dataset.save]));document.querySelectorAll('[data-state]').forEach(b=>b.onclick=async()=>{let r=rows[+b.dataset.index],prev=r.estado_validacao;r.estado_validacao=b.dataset.state;const ok=await save(r);if(!ok)r.estado_validacao=prev;draw()})}
function download(n,t,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([t],{type}));a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}$('q').oninput=draw;$('status').onchange=draw;$('reload').onclick=load;$('legacy').onclick=()=>{showLegacy=!showLegacy;$('legacy').textContent=showLegacy?'Ocultar candidatas antigas':'Mostrar candidatas antigas';draw()};$('backup').onclick=()=>download('marketscope-backup.json',JSON.stringify({exportado_em:new Date().toISOString(),campanhas:rows},null,2),'application/json');$('csv').onclick=()=>{let a=rows.filter(r=>r.estado_validacao==='Aprovada'),keys=['candidate_id','titulo','marca_sugerida','retalhista_sugerido','mecanicas_sugeridas','oferta_sugerida','valores_detetados','data_inicio','data_fim','ambito','publico_alvo','resumo_interpretacao','url','observacoes_revisor'];let c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('marketscope-aprovadas.csv',[keys.join(','),...a.map(r=>keys.map(k=>c(r[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')};$('file').onchange=async e=>{try{let p=JSON.parse(await e.target.files[0].text());if(!Array.isArray(p.campanhas))throw Error('JSON inválido');for(let r of p.campanhas){r.estado_validacao='Pendente de validação';await save(r)}await load();say('Importação concluída; itens importados mantidos pendentes.')}catch(x){say('Falha na importação: '+x.message)}e.target.value=''};db.auth.onAuthStateChange(()=>setTimeout(state,0));state();
