<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketScope | Revisão de campanhas</title>
<style>:root{font-family:Inter,system-ui,Arial;color:#182230;background:#f3f5f8}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}header{background:#101d32;color:white;padding:24px;border-radius:14px}h1{margin:0 0 8px}.muted{color:#64748b;font-size:14px}.toolbar,.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select,textarea{padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}button{border:0;border-radius:7px;padding:10px 14px;background:#1455a0;color:white;font-weight:600;cursor:pointer}.card{background:white;border:1px solid #dce2ea;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:#526176;font-weight:700}.field input,.field textarea{width:100%;box-sizing:border-box}.wide{grid-column:1/-1}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#fff2cc;font-size:12px}.approve{background:#147d52}.reject{background:#9f3440}.note{background:#eaf1fb;padding:12px;border-radius:8px;margin-top:14px}@media(max-width:650px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head>
<body><main class="wrap"><header><h1>MarketScope</h1><div>Área de validação de campanhas — Portugal | Pneus ligeiros</div></header>
<p class="note">A extração é preliminar. Confirme os dados na fonte original antes de aprovar. As alterações ficam guardadas neste navegador e não são enviadas automaticamente para o GitHub nem para o dashboard.</p>
<div class="toolbar"><input id="q" placeholder="Pesquisar marca, título ou retalhista…"><select id="status"><option>Todos</option><option>Pendente de validação</option><option>Aprovada</option><option>Rejeitada</option></select><button id="reload">Recarregar ficheiro</button><button id="export">Exportar aprovadas (JSON)</button><button id="exportCsv">Exportar aprovadas (CSV)</button></div><div id="summary" class="muted"></div><section id="list"></section></main>
<script>
const $=id=>document.getElementById(id);let records=[];const STORE='marketscope_review_v1';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{const response=await fetch('monitorizacao/candidatas_estruturadas.json?ts='+Date.now());if(!response.ok)throw Error('Ficheiro estruturado ainda não existe. Execute o workflow.');const data=await response.json();records=data.campanhas||[];const saved=JSON.parse(localStorage.getItem(STORE)||'{}');records=records.map(r=>({...r,...(saved[r.candidate_id]||{})}));render()}catch(e){$('list').innerHTML='<div class="card">Não foi possível carregar candidatas: '+esc(e.message)+'</div>'}}
function persist(r){let saved=JSON.parse(localStorage.getItem(STORE)||'{}');saved[r.candidate_id]=r;localStorage.setItem(STORE,JSON.stringify(saved))}
function render(){const query=$('q').value.toLowerCase(),status=$('status').value;const shown=records.filter(r=>(status==='Todos'||(r.estado_validacao||'Pendente de validação')===status)&&JSON.stringify(r).toLowerCase().includes(query));$('summary').textContent=`${shown.length} registos visíveis · ${records.filter(r=>r.estado_validacao==='Aprovada').length} aprovados · ${records.filter(r=>(r.estado_validacao||'Pendente de validação')==='Pendente de validação').length} pendentes`;
$('list').innerHTML=shown.map(r=>{const i=records.indexOf(r);const fields=[['marca_sugerida','Marca'],['retalhista_sugerido','Retalhista'],['mecanicas_sugeridas','Mecânica(s)'],['valores_detetados','Valores detetados'],['data_inicio','Data de início (AAAA-MM-DD)'],['data_fim','Data de fim (AAAA-MM-DD)'],['ambito','Âmbito'],['publico_alvo','Público-alvo']];return `<article class="card" data-i="${i}"><span class="pill">${esc(r.estado_validacao||'Pendente de validação')}</span><h2>${esc(r.titulo)}</h2><p class="muted">${esc(r.candidate_id)} · ${esc(r.publicador)} · Detetada: ${esc(r.detetada_em_utc)}</p><p><a href="${esc(r.url)}" target="_blank" rel="noopener">Abrir resultado original ↗</a></p><div class="grid">${fields.map(([k,label])=>`<div class="field"><label>${label}</label><input data-k="${k}" value="${esc(Array.isArray(r[k])?r[k].join('; '):r[k])}"></div>`).join('')}<div class="field wide"><label>Resumo / interpretação revista</label><textarea data-k="resumo_interpretacao" rows="3">${esc(r.resumo_interpretacao)}</textarea></div><div class="field wide"><label>Observações do revisor</label><textarea data-k="observacoes_revisor" rows="2">${esc(r.observacoes_revisor)}</textarea></div></div><p class="muted">${esc(r.notas)} · Consulta: ${esc(r.consulta)}</p><div class="actions"><button class="approve" data-state="Aprovada" data-index="${i}">Aprovar</button><button class="reject" data-state="Rejeitada" data-index="${i}">Rejeitar</button><button data-state="Pendente de validação" data-index="${i}">Voltar a pendente</button></div></article>`}).join('')||'<div class="card">Sem registos para estes filtros.</div>';
document.querySelectorAll('[data-i]').forEach(card=>card.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('change',()=>{const r=records[+card.dataset.i];r[el.dataset.k]=el.value;persist(r)})));document.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>{const r=records[+b.dataset.index];r.estado_validacao=b.dataset.state;r.validado_em=new Date().toISOString();r.validado_por='Revisão local';persist(r);render()}))}
function approved(){return records.filter(r=>r.estado_validacao==='Aprovada')}
$('q').addEventListener('input',render);$('status').addEventListener('change',render);$('reload').onclick=load;
$('export').onclick=()=>download('marketscope-campanhas-aprovadas.json',JSON.stringify({exportado_em:new Date().toISOString(),campanhas:approved()},null,2),'application/json');
function download(name,text,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('exportCsv').onclick=()=>{const rows=approved(),keys=['candidate_id','titulo','marca_sugerida','retalhista_sugerido','mecanicas_sugeridas','valores_detetados','data_inicio','data_fim','ambito','publico_alvo','resumo_interpretacao','url','observacoes_revisor','validado_por','validado_em'];const cell=v=>'"'+String(Array.isArray(v)?v.join('; '):(v??'')).replace(/"/g,'""')+'"';download('marketscope-campanhas-aprovadas.csv',[keys.join(','),...rows.map(r=>keys.map(k=>cell(r[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')};load();
</script></body></html>
