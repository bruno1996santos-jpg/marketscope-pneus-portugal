<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketScope | Revisão de campanhas</title><style>
:root{font-family:Inter,system-ui,Arial;color:#182230;background:#f3f5f8}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}header{background:#101d32;color:white;padding:24px;border-radius:14px}h1{margin:0 0 8px}.muted{color:#64748b;font-size:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select,textarea{padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}button{border:0;border-radius:7px;padding:10px 14px;background:#1455a0;color:white;font-weight:600;cursor:pointer}.card{background:white;border:1px solid #dce2ea;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:#526176;font-weight:700}.field input,.field textarea,.field select{width:100%;box-sizing:border-box}.wide{grid-column:1/-1}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#fff2cc;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.approve{background:#147d52}.reject{background:#9f3440}.note{background:#eaf1fb;padding:12px;border-radius:8px;margin-top:14px}@media(max-width:650px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><header><h1>MarketScope</h1><div>Área de validação de campanhas — Portugal | Pneus ligeiros</div></header><p class="note">A interpretação é automática e preliminar. Confirme cada dado na fonte primária. Aprovar aqui apenas altera o estado no navegador; para integrar no dashboard, exporte os registos aprovados e atualize o CSV principal.</p><div class="toolbar"><input id="q" placeholder="Pesquisar marca, título ou retalhista…"><select id="status"><option value="Todos">Todos os estados</option><option>Pendente de validação</option><option>Aprovada</option><option>Rejeitada</option></select><button id="reload">Recarregar dados</button><button id="export">Exportar aprovadas (JSON)</button></div><div id="summary" class="muted"></div><section id="list"></section></main><script>
let records=[];const $=id=>document.getElementById(id);function val(r,k){return r[k]||''}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{let res=await fetch('monitorizacao/candidatas_estruturadas.json?ts='+Date.now());if(!res.ok)throw Error('Ficheiro ainda não gerado pelo workflow');let d=await res.json();records=d.campanhas||[];render()}catch(e){$('list').innerHTML='<div class="card">Não foi possível carregar candidatas. Execute o workflow de monitorização primeiro.<br><span class="muted">'+esc(e.message)+'</span></div>';}}
function render(){let q=$('q').value.toLowerCase(),s=$('status').value;let filtered=records.filter(r=>(s==='Todos'||(r.estado_validacao||'Pendente de validação')===s)&&JSON.stringify(r).toLowerCase().includes(q));$('summary').textContent=`${filtered.length} registos visíveis · ${records.filter(r=>r.estado_validacao==='Aprovada').length} aprovados · ${records.filter(r=>(r.estado_validacao||'Pendente de validação')==='Pendente de validação').length} pendentes`;$('list').innerHTML=filtered.map(r=>{let i=records.indexOf(r);return `<article class="card" data-i="${i}"><span class="pill">${esc(r.estado_validacao||'Pendente de validação')}</span><h2>${esc(r.titulo)}</h2><p class="muted">ID ${esc(r.candidate_id)} · Publicador: ${esc(r.publicador)} · Detetada: ${esc(r.detetada_em_utc)}</p><p><a href="${esc(r.url)}" target="_blank" rel="noopener">Abrir resultado original ↗</a></p><div class="grid">${[['marca_sugerida','Marca'],['retalhista_sugerido','Retalhista'],['mecanicas_sugeridas','Mecânica(s)'],['valores_detetados','Valor(es)'],['data_inicio','Data de início (AAAA-MM-DD)'],['data_fim','Data de fim (AAAA-MM-DD)'],['ambito','Âmbito'],['publico_alvo','Público-alvo']].map(([k,l])=>`<div class="field"><label>${l}</label><input data-k="${k}" value="${esc(Array.isArray(r[k])?r[k].join('; '):r[k])}"></div>`).join('')}<div class="field wide"><label>Resumo / interpretação</label><textarea data-k="resumo_interpretacao" rows="2">${esc(r.resumo_interpretacao)}</textarea></div><div class="field wide"><label>Observações do revisor</label><textarea data-k="observacoes_revisor" rows="2">${esc(r.observacoes_revisor)}</textarea></div></div><p class="muted">${esc(r.notas||'')} ${esc(r.consulta||'')}</p><div class="actions"><button class="approve" onclick="decide(${i},'Aprovada')">Aprovar</button><button class="reject" onclick="decide(${i},'Rejeitada')">Rejeitar</button><button onclick="decide(${i,'Pendente de validação')}">Voltar a pendente</button></div></article>`}).join('')||'<div class="card">Sem registos para estes filtros.</div>';document.querySelectorAll('[data-i]').forEach(card=>card.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('change',()=>{records[+card.dataset.i][el.dataset.k]=el.value;})));}
window.decide=(i,state)=>{records[i].estado_validacao=state;records[i].validado_por='Revisão local';records[i].validado_em=new Date().toISOString();render()};$('q').addEventListener('input',render);$('status').addEventListener('change',render);$('reload').onclick=load;$('export').onclick=()=>{let approved=records.filter(r=>r.estado_validacao==='Aprovada');let blob=new Blob([JSON.stringify({exportado_em:new Date().toISOString(),campanhas:approved},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='marketscope-campanhas-aprovadas.json';a.click();URL.revokeObjectURL(a.href)};load();
</script></body></html>
