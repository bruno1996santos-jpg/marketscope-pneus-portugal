<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarketScope | Recuperar palavra-passe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font:16px system-ui;background:#f3f5f8;color:#182230;margin:0}.wrap{max-width:520px;margin:8vh auto;padding:24px}.card{background:white;border:1px solid #dce2ea;border-radius:12px;padding:24px;box-shadow:0 5px 20px #1822300d}h1{margin-top:0}label{display:block;margin:14px 0 6px}input,button{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:7px;box-sizing:border-box;width:100%}button{background:#1455a0;color:white;cursor:pointer;margin-top:16px}#form{display:none}.note{color:#526174}#msg{overflow-wrap:anywhere}
</style></head>
<body><main class="wrap"><section class="card"><h1>MarketScope</h1><h2>Recuperar palavra-passe</h2><p class="note">Utilize esta página para definir uma nova palavra-passe através do link de recuperação enviado por email.</p>
<form id="form"><label for="p1">Nova palavra-passe</label><input id="p1" type="password" minlength="8" autocomplete="new-password" required><label for="p2">Confirmar palavra-passe</label><input id="p2" type="password" minlength="8" autocomplete="new-password" required><button id="submit" type="submit">Guardar nova palavra-passe</button></form><p id="msg" role="status">A validar o link de recuperação…</p><p><a href="./revisao.html">Voltar à página de revisão</a></p></section></main>
<script>
const supabase=window.supabase.createClient('https://lgjrnuelvwsvmbusufvu.supabase.co','sb_publishable_VAeZZvYfq134xQVSJ0APxQ_f1x75mXG');
const form=document.getElementById('form'),msg=document.getElementById('msg'),submit=document.getElementById('submit');let recovery=false;
function showError(e){msg.textContent='Não foi possível validar o link: '+(e?.message||'link inválido ou expirado')+'. Solicite um novo email de recuperação.';form.style.display='none';}
supabase.auth.onAuthStateChange((event,session)=>{
 if(event==='PASSWORD_RECOVERY'&&session){recovery=true;form.style.display='block';msg.textContent='Link validado. Introduza e confirme a nova palavra-passe.';}
});
(async()=>{const {data:{session},error}=await supabase.auth.getSession();if(error){showError(error);return}if(session){recovery=true;form.style.display='block';msg.textContent='Sessão de recuperação disponível. Introduza a nova palavra-passe.';return}if(location.hash.includes('error=')){const p=new URLSearchParams(location.hash.slice(1));showError(new Error(p.get('error_description')||p.get('error_code')||p.get('error')));return}msg.textContent='Abra esta página através do link mais recente recebido por email. Se o link já expirou, solicite outro email.';})();
form.addEventListener('submit',async e=>{e.preventDefault();if(!recovery){showError(new Error('sessão de recuperação não encontrada'));return}const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<8){msg.textContent='A palavra-passe deve ter pelo menos 8 caracteres.';return}if(a!==b){msg.textContent='As palavras-passe não coincidem.';return}submit.disabled=true;msg.textContent='A guardar…';const {error}=await supabase.auth.updateUser({password:a});submit.disabled=false;if(error){msg.textContent='Erro ao atualizar a palavra-passe: '+error.message;return}form.style.display='none';msg.textContent='Palavra-passe atualizada com sucesso. Pode agora iniciar sessão na página de revisão.';await supabase.auth.signOut();});
</script></body></html>
